[workspace]
resolver = "2"
members = [
    "crates/qcircuit",
    "crates/qsemantics",
    "crates/qrules",
    "crates/qresynth",
    "crates/qopt",
    "crates/qsynth",
    "crates/guoq-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/amandashoe/queso-guoq-rs"

[workspace.dependencies]
qcircuit = { path = "crates/qcircuit" }
qsemantics = { path = "crates/qsemantics" }
qrules = { path = "crates/qrules" }
qresynth = { path = "crates/qresynth" }
qopt = { path = "crates/qopt" }
qsynth = { path = "crates/qsynth" }

anyhow = "1"
thiserror = "2"
ndarray = "0.16"
num-complex = "0.4"
num-rational = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
petgraph = "0.6"
rayon = "1"
rand = "0.8"
rand_chacha = "0.3"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "string"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
