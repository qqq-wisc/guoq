name: wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # python/guoq/bqskit_worker.py is a copy of py/bqskit_worker.py so the wheel can
  # bundle it; a drifted copy would ship a worker the Rust side no longer speaks to.
  check-worker-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmp py/bqskit_worker.py python/guoq/bqskit_worker.py

  build:
    needs: check-worker-copy
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    needs: check-worker-copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  # Publishes when a v* tag is pushed. Uses PyPI trusted publishing: the `guoq`
  # project on PyPI must list this repository and workflow as a trusted publisher
  # (no API token needed once that is configured).
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
